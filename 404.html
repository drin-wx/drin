<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102a43">
  <meta name="robots" content="noindex, nofollow">
  <title>Site Not Found</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #102a43;
      --blue: #1769aa;
      --ink: #243b53;
      --muted: #627d98;
      --line: #d9e5ef;
      --paper: #ffffff;
      --background: #f3f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--ink);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .notice {
      width: 100%;
      max-width: 560px;
      padding: 48px 36px;
      text-align: center;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 16px 45px rgba(16, 42, 67, 0.08);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8f4fb;
      color: var(--blue);
    }

    .icon svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    .code {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(28px, 5vw, 36px);
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    .message {
      max-width: 390px;
      margin: 14px auto 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .home-link {
      display: inline-block;
      padding: 11px 20px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .home-link:hover {
      background: var(--navy);
      transform: translateY(-1px);
    }

    .home-link:focus-visible {
      outline: 3px solid #8dd2ff;
      outline-offset: 3px;
    }

    .footer {
      margin-top: 32px;
      color: #829ab1;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .notice { padding: 38px 22px; border-radius: 12px; }
      .message { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="notice" role="main">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>
        <path d="M14 3h7v7"/>
        <path d="M21 3 11 13"/>
        <path d="M7 8h3M7 12h2"/>
      </svg>
    </div>

    <p class="code">404 · Page unavailable</p>
    <h1>Site Not Found</h1>
    <p class="message">
      The page you are looking for may have been moved, removed, or is currently unavailable.
      Please check the address and try again.
    </p>

    <a class="home-link" href="/" aria-label="Return to the home page">Return to Home</a>

    <p class="footer">Thank you for your understanding.</p>
  </main>
</body>
</html>
